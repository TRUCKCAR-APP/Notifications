spring:
  datasource:
    url: jdbc:h2:mem:truckcar_notifications_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

aws:
  region: us-east-1
  endpoint-override: http://localhost:4566
  access-key-id: test
  secret-access-key: test
  s3:
    bucket: test-bucket
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:test-topic
  polly:
    voice-id: Lupe
    presigned-url-duration-hours: 24

app:
  jwt:
    secret: dHJ1Y2tkYXItdXNlci1pZGVudGl0eS1zZWNyZXQta2V5LWJhc2U2NC1lbmNvZGVkLWF0LWxlYXN0LTI1Ni1iaXRz
  security:
    api-key: test-api-key
