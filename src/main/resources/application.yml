server:
  port: 8087

spring:
  application:
    name: ms-notifications

  datasource:
    url: jdbc:postgresql://localhost:5432/truckdar_db
    username: truckdar_admin
    password: truckdar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/truckdar_db
    user: truckdar_admin
    password: truckdar_password

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifications-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

app:
  kafka:
    topics:
      load-events: truckdar.events.load-allocation
      allocation-results: truckdar.events.fleet-allocation-results
      assignment-notifications: truckdar.events.assignment-notifications
      restrictions: truckdar.events.road-restrictions
  jwt:
    secret: TruckDarSecretKeySecurityAuthenticationToken2026MasterKey!
  security:
    api-key: truckdar-internal-service-key-2026

security:
  jwt:
    secret-key: TruckDarSecretKeySecurityAuthenticationToken2026MasterKey!

cloud:
  aws:
    region:
      static: us-east-1
    credentials:
      access-key: test
      secret-key: test