# =============================================================================
# Perfil: local (desarrollo rápido en máquina local)
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:truckcar_notifications;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    listener:
      auto-startup: false

aws:
  region: us-east-1
  endpoint-override: http://localhost:4566
  access-key-id: test
  secret-access-key: test
  s3:
    bucket: truckcar-voice-notifications
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:truckcar-notifications

logging:
  level:
    com.truckcar.notifications: DEBUG
    org.springframework.security: INFO
